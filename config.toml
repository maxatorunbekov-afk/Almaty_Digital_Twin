[project]
name = "Almaty District Heating Digital Twin"
model = "models/Almaty_DT_Scientific.fheat"
original_model = "models/Almaty_original.fheat"
work_dir = "runtime"
database = "runtime/digital_twin.sqlite3"
recommendation_file = "runtime/recommendation.json"
cycle_seconds = 10
periodic_simulation_seconds = 900

[opcua]
endpoint = "opc.tcp://192.168.111.100:4840"
namespace_index = 3
read_db = "OPCUA_Output"
legacy_write_db = "OPCUA_Input"
timeout_seconds = 5
security_string = ""
username = ""
password_env = "ALMATY_OPCUA_PASSWORD"

[sql]
enabled = false
connection_string_env = "ALMATY_SQL_CONNECTION_STRING"
history_query = "SELECT measured_at, address, heating, dhw, p1, p2 FROM dbo.v_DT_Measurements WHERE measured_at >= ? ORDER BY measured_at"
history_hours = 168

[fluidit]
# Production path: candidate.fheat + simulation_request.json -> Fluidit CLI -> result.json.
mode = "command"
shortcut = "C:\\Users\\Public\\Desktop\\Fluidit Heat 2.8.lnk"
timeout_seconds = 900
parent_scenario_uuid = "d3c6d76e-868c-5cf0-978b-025a19b8c925"
result_filename = "result.json"
# Load the local licensed-build command from this JSON string array.
command_file = "config/fluidit_command.json"
# Placeholders: {model}, {output_dir}, {scenario_uuid}, {request_json}, {result_json}
command = []

[environment]
ambient_temperature_c = -20.1
ground_temperature_c = 10.0
return_temperature_c = 47.0
gcal_h_to_kw = 1163.0

[anomaly]
min_consumer_dp_bar = 3.5
min_pressure_bar = 0.0
max_pressure_bar = 16.0
max_demand_gcal_h = 2.0
relative_demand_warning = 0.40
frozen_cycles = 12

[optimization]
supply_temperature_candidates_c = [90.0, 92.5, 95.0, 97.5, 100.0]
differential_pressure_candidates_bar = [3.5, 4.0, 4.5]
required_min_dp_bar = 3.5
maximum_deficit_kw = 0.1
weight_pump_energy = 0.0
weight_heat_loss = 0.03
weight_deficit = 1000.0
weight_setpoint_change = 2.0

[control]
# Safe default: recommendations only. Enable only after importing the TIA SCL
# files, testing in PLCSIM Advanced and verifying all OPC UA nodes.
enable_writeback = false
writeback_mode = "legacy_results"
require_operator_approval = true
require_complete_fluidit_metrics = true
min_supply_temperature_c = 80.0
max_supply_temperature_c = 110.0
min_differential_pressure_bar = 2.5
max_differential_pressure_bar = 6.0
max_supply_change_per_cycle_c = 5.0
max_dp_change_per_cycle_bar = 0.5
initial_supply_temperature_c = 95.0
initial_differential_pressure_bar = 4.0

[control.nodes]
valid = 'ns=3;s="DT_Command"."Valid"'
enable = 'ns=3;s="DT_Command"."Enable"'
operator_approved = 'ns=3;s="DT_Command"."OperatorApproved"'
request_id = 'ns=3;s="DT_Command"."RequestId"'
supply_temperature_c = 'ns=3;s="DT_Command"."SupplyTemperature_C"'
differential_pressure_bar = 'ns=3;s="DT_Command"."DifferentialPressure_bar"'
unix_time_s = 'ns=3;s="DT_Command"."UnixTime_s"'
ack_id = 'ns=3;s="DT_Status"."AckId"'

[scada_trigger]
# One SCADA request runs one real Fluidit scenario from the latest OPCUA_Output.
poll_seconds = 1.0
supply_temperature_c = 95.0
differential_pressure_bar = 4.0

[scada_trigger.nodes]
request = 'ns=3;s="DT_Model_Control"."Request"'
busy = 'ns=3;s="DT_Model_Control"."Busy"'
done = 'ns=3;s="DT_Model_Control"."Done"'
error = 'ns=3;s="DT_Model_Control"."Error"'
state = 'ns=3;s="DT_Model_Control"."State"'
error_code = 'ns=3;s="DT_Model_Control"."ErrorCode"'
last_run_unix_s = 'ns=3;s="DT_Model_Control"."LastRunUnix_s"'
last_duration_s = 'ns=3;s="DT_Model_Control"."LastDuration_s"'
last_min_dp_bar = 'ns=3;s="DT_Model_Control"."LastMinDP_bar"'
last_max_deficit_kw = 'ns=3;s="DT_Model_Control"."LastMaxDeficit_kW"'
last_heat_loss_kw = 'ns=3;s="DT_Model_Control"."LastHeatLoss_kW"'

